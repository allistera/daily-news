name: Daily News Curation Pipeline

on:
  schedule:
    # Trigger every day at 8:00 AM UTC
    - cron: '0 8 * * *'
  workflow_dispatch:
    # Allow manual triggering from the Actions tab

jobs:
  curate-and-send:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Code Linter
        run: npm run lint

      - name: Compile and Send Personalized News
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          USER_NAME: ${{ secrets.USER_NAME }}
          USER_EMAIL: ${{ secrets.USER_EMAIL }}
          USER_INTERESTS: ${{ secrets.USER_INTERESTS }}
          USER_TONE: ${{ secrets.USER_TONE }}
          USER_PREFERENCES: ${{ secrets.USER_PREFERENCES }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          CLAUDE_MODEL: ${{ secrets.CLAUDE_MODEL }}
        run: npm run example
