name: Daily Claude Prompt

on:
  schedule:
    # 10:30 AM UTC — adjust for your timezone:
    #   BST (UTC+1, summer): use "30 9 * * *"  ← set for Scotland/BST
    #   GMT (UTC+0, winter): use "30 10 * * *"
    - cron: "30 9 * * *"
  workflow_dispatch: # Also triggerable manually from the Actions tab

jobs:
  run-claude-and-email:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # ── 1. Checkout so prompt.txt is available in the workspace ─────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Run Claude with prompt.txt ────────────────────────────────────────
      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-base-action@beta
        with:
          prompt_file: "prompt.txt"
          allowed_tools: "WebSearch,WebFetch,View,GlobTool,GrepTool"
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # 30 turns gives Claude room to search all sources AND write the summary
          max_turns: "30"

      # ── 3. Extract Claude output and send via Resend ──────────────────────────
      - name: Send output via Resend
        if: always()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          python3 << 'EOF'
          import os, json, subprocess, datetime, re

          run_url   = os.environ.get("RUN_URL", "")
          api_key   = os.environ.get("RESEND_API_KEY", "")
          exec_file = os.environ.get("EXECUTION_FILE", "")
          run_date  = datetime.datetime.now(datetime.timezone.utc).strftime("%A, %d %B %Y")

          # ── Parse execution file (mixed pretty-printed and compact NDJSON) ────
          output = "(no output received)"

          if not exec_file or not os.path.exists(exec_file):
              output = f"(execution file not found: {exec_file!r})"
          else:
              try:
                  raw = open(exec_file).read()

                  # Split into individual JSON objects by finding top-level braces.
                  # The file mixes pretty-printed and single-line objects so we
                  # can't simply splitlines — instead re-parse the whole blob.
                  entries = []
                  depth = 0
                  start = None
                  for i, ch in enumerate(raw):
                      if ch == '{':
                          if depth == 0:
                              start = i
                          depth += 1
                      elif ch == '}':
                          depth -= 1
                          if depth == 0 and start is not None:
                              chunk = raw[start:i+1].strip()
                              try:
                                  entries.append(json.loads(chunk))
                              except json.JSONDecodeError:
                                  pass
                              start = None

                  print(f"Parsed {len(entries)} entries from execution file")

                  # Priority 1: last assistant message with actual text content
                  for entry in reversed(entries):
                      if entry.get("type") != "assistant":
                          continue
                      content = entry.get("message", {}).get("content", [])
                      if isinstance(content, list):
                          for block in reversed(content):
                              if isinstance(block, dict) and block.get("type") == "text":
                                  text = block.get("text", "").strip()
                                  if text and len(text) > 50:
                                      output = text
                                      break
                      if output != "(no output received)":
                          break

                  # Priority 2: result entry with a non-empty result field
                  if output == "(no output received)":
                      for entry in reversed(entries):
                          if entry.get("type") == "result" and entry.get("result", "").strip():
                              output = entry["result"].strip()
                              break

                  # Priority 3: last user tool_result with substantial text content
                  # (catches cases where Claude ran out of turns mid-search)
                  if output == "(no output received)":
                      for entry in reversed(entries):
                          if entry.get("type") != "user":
                              continue
                          content = entry.get("message", {}).get("content", [])
                          if isinstance(content, list):
                              for block in reversed(content):
                                  if isinstance(block, dict) and block.get("type") == "tool_result":
                                      text = block.get("content", "")
                                      if isinstance(text, str) and len(text) > 200:
                                          output = f"[Note: Claude ran out of turns. Last search result below]\n\n{text}"
                                          break
                          if output != "(no output received)":
                              break

              except Exception as e:
                  import traceback
                  output = f"(error reading execution file: {e}\n{traceback.format_exc()})"

          print(f"Output length: {len(output)} characters")
          print(f"Output preview: {output[:300]}")

          # ── Convert markdown to HTML ──────────────────────────────────────────
          html_lines = []
          for line in output.split("\n"):
              esc = line.replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;")
              if esc.startswith("### "):
                  html_lines.append(f'<h3 style="margin:20px 0 6px;color:#333;">{esc[4:]}</h3>')
              elif esc.startswith("## "):
                  html_lines.append(f'<h2 style="margin:24px 0 8px;color:#111;border-bottom:1px solid #eee;padding-bottom:6px;">{esc[3:]}</h2>')
              elif esc.startswith("# "):
                  html_lines.append(f'<h1 style="margin:28px 0 10px;color:#000;">{esc[2:]}</h1>')
              elif esc.startswith("- ") or esc.startswith("* "):
                  inner = re.sub(r'\*\*(.+?)\*\*', r'<strong>\1</strong>', esc[2:])
                  html_lines.append(f'<li style="margin:4px 0;">{inner}</li>')
              elif esc == "":
                  html_lines.append("<br>")
              else:
                  inner = re.sub(r'\*\*(.+?)\*\*', r'<strong>\1</strong>', esc)
                  html_lines.append(f'{inner}<br>')

          html_body = "\n".join(html_lines)

          html = f"""<html>
            <body style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
                         max-width:760px;margin:auto;padding:32px;color:#1a1a1a;">
              <h2 style="margin-bottom:4px;">&#x1F4F0; Daily News Briefing</h2>
              <p style="color:#888;font-size:13px;margin-top:0;">{run_date}</p>
              <hr style="border:none;border-top:1px solid #e5e5e5;margin:20px 0;">
              <div style="font-size:14px;line-height:1.7;">
                {html_body}
              </div>
              <hr style="border:none;border-top:1px solid #e5e5e5;margin:20px 0;">
              <p style="font-size:12px;color:#bbb;">
                <a href="{run_url}" style="color:#6c63ff;text-decoration:none;">View workflow run &rarr;</a>
              </p>
            </body>
          </html>"""

          payload = {
              "from":    "Daily News <reports@infinitywave.design>",
              "to":      ["me@allisterantosik.com"],
              "subject": f"Daily News Briefing \u2014 {run_date}",
              "html":    html,
              "text":    output,
          }

          result = subprocess.run(
              ["curl", "-s", "-X", "POST", "https://api.resend.com/emails",
               "-H", f"Authorization: Bearer {api_key}",
               "-H", "Content-Type: application/json",
               "-d", json.dumps(payload),
               "--fail-with-body"],
              capture_output=True, text=True,
          )

          print("=== Resend response ===")
          print(result.stdout)

          if result.returncode != 0:
              raise SystemExit(f"curl failed: {result.stderr}")

          response = json.loads(result.stdout)
          if "id" in response:
              print(f"Email sent. Resend ID: {response['id']}")
          else:
              raise SystemExit(f"Unexpected Resend response: {result.stdout}")
          EOF
