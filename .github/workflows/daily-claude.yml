name: Daily Claude Prompt

on:
  schedule:
    # 10:30 AM UTC — adjust for your timezone:
    #   BST (UTC+1, summer): use "30 9 * * *"  ← set for Scotland/BST
    #   GMT (UTC+0, winter): use "30 10 * * *"
    - cron: "30 9 * * *"
  workflow_dispatch: # Also triggerable manually from the Actions tab

jobs:
  run-claude-and-email:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # ── 1. Checkout so prompt.txt is available in the workspace ─────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Build final prompt: append file output instruction ────────────────
      - name: Prepare prompt
        run: |
          cat prompt.txt > /tmp/final_prompt.txt
          echo "" >> /tmp/final_prompt.txt
          echo "---" >> /tmp/final_prompt.txt
          echo "IMPORTANT: When you have finished researching and compiling all sections, write your complete final output to the file /tmp/news_output.md using the Bash tool. Use the exact command: bash -c 'cat > /tmp/news_output.md << '\''NEWSEOF'\''' followed by your content and NEWSEOF. This is required — the file will be emailed." >> /tmp/final_prompt.txt

      # ── 3. Run Claude with the augmented prompt ──────────────────────────────
      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-base-action@beta
        with:
          prompt_file: "/tmp/final_prompt.txt"
          allowed_tools: "WebSearch,WebFetch,Bash,View,GlobTool,GrepTool"
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          max_turns: "40"

      # ── 4. Extract output and send via Resend ────────────────────────────────
      - name: Send output via Resend
        if: always()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          python3 << 'EOF'
          import os, json, subprocess, datetime, re

          run_url  = os.environ.get("RUN_URL", "")
          api_key  = os.environ.get("RESEND_API_KEY", "")
          exec_file = os.environ.get("EXECUTION_FILE", "")
          run_date = datetime.datetime.now(datetime.timezone.utc).strftime("%A, %d %B %Y")

          # ── Priority 1: read the output file Claude was told to write ─────────
          output = ""
          if os.path.exists("/tmp/news_output.md"):
              output = open("/tmp/news_output.md").read().strip()
              print(f"Read {len(output)} chars from /tmp/news_output.md")

          # ── Priority 2: fall back to execution log if file is missing/empty ──
          if not output and exec_file and os.path.exists(exec_file):
              print("Output file missing, falling back to execution log...")
              try:
                  raw = open(exec_file).read()

                  # Brace-depth parser handles mixed pretty/compact NDJSON
                  entries = []
                  depth, start = 0, None
                  for i, ch in enumerate(raw):
                      if ch == '{':
                          if depth == 0: start = i
                          depth += 1
                      elif ch == '}':
                          depth -= 1
                          if depth == 0 and start is not None:
                              try:
                                  entries.append(json.loads(raw[start:i+1]))
                              except json.JSONDecodeError:
                                  pass
                              start = None

                  print(f"Parsed {len(entries)} entries from execution log")

                  # Find the longest assistant text block — most likely the summary
                  best = ""
                  for entry in entries:
                      if entry.get("type") != "assistant":
                          continue
                      content = entry.get("message", {}).get("content", [])
                      if not isinstance(content, list):
                          continue
                      for block in content:
                          if isinstance(block, dict) and block.get("type") == "text":
                              text = block.get("text", "").strip()
                              if len(text) > len(best):
                                  best = text
                  if best:
                      output = best

              except Exception as e:
                  import traceback
                  output = f"(error reading execution log: {e}\n{traceback.format_exc()})"

          if not output:
              output = "(no output received — check the workflow run logs)"

          print(f"Final output length: {len(output)} chars")
          print(f"Preview: {output[:300]}")

          # ── Convert markdown to HTML ──────────────────────────────────────────
          html_lines = []
          for line in output.split("\n"):
              esc = line.replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;")
              if esc.startswith("### "):
                  html_lines.append(f'<h3 style="margin:20px 0 6px;color:#333;">{esc[4:]}</h3>')
              elif esc.startswith("## "):
                  html_lines.append(f'<h2 style="margin:24px 0 8px;color:#111;border-bottom:1px solid #eee;padding-bottom:6px;">{esc[3:]}</h2>')
              elif esc.startswith("# "):
                  html_lines.append(f'<h1 style="margin:28px 0 10px;color:#000;">{esc[2:]}</h1>')
              elif esc.startswith("- ") or esc.startswith("* "):
                  inner = re.sub(r'\*\*(.+?)\*\*', r'<strong>\1</strong>', esc[2:])
                  html_lines.append(f'<li style="margin:4px 0;">{inner}</li>')
              elif esc == "":
                  html_lines.append("<br>")
              else:
                  inner = re.sub(r'\*\*(.+?)\*\*', r'<strong>\1</strong>', esc)
                  html_lines.append(f'{inner}<br>')

          html_body = "\n".join(html_lines)
          html = f"""<html>
            <body style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
                         max-width:760px;margin:auto;padding:32px;color:#1a1a1a;">
              <h2 style="margin-bottom:4px;">&#x1F4F0; Daily News Briefing</h2>
              <p style="color:#888;font-size:13px;margin-top:0;">{run_date}</p>
              <hr style="border:none;border-top:1px solid #e5e5e5;margin:20px 0;">
              <div style="font-size:14px;line-height:1.7;">{html_body}</div>
              <hr style="border:none;border-top:1px solid #e5e5e5;margin:20px 0;">
              <p style="font-size:12px;color:#bbb;">
                <a href="{run_url}" style="color:#6c63ff;text-decoration:none;">View workflow run &rarr;</a>
              </p>
            </body>
          </html>"""

          payload = {
              "from":    "Daily News <reports@infinitywave.design>",
              "to":      ["me@allisterantosik.com"],
              "subject": f"Daily News Briefing \u2014 {run_date}",
              "html":    html,
              "text":    output,
          }

          result = subprocess.run(
              ["curl", "-s", "-X", "POST", "https://api.resend.com/emails",
               "-H", f"Authorization: Bearer {api_key}",
               "-H", "Content-Type: application/json",
               "-d", json.dumps(payload),
               "--fail-with-body"],
              capture_output=True, text=True,
          )
          print("=== Resend response ===")
          print(result.stdout)
          if result.returncode != 0:
              raise SystemExit(f"curl failed: {result.stderr}")
          response = json.loads(result.stdout)
          if "id" in response:
              print(f"Email sent. Resend ID: {response['id']}")
          else:
              raise SystemExit(f"Unexpected Resend response: {result.stdout}")
          EOF
