name: Daily Claude Prompt

on:
  schedule:
    # 10:30 AM Scotland time, year-round:
    #   BST (UTC+1, last Sun Mar → last Sun Oct): fires at 09:30 UTC
    #   GMT (UTC+0, last Sun Oct → last Sun Mar): fires at 10:30 UTC
    # Both entries run every day; the workflow uses a dedup check to ensure
    # only one email is sent per calendar day.
    - cron: "30 9 * * *"   # 10:30 BST (summer)
    - cron: "30 10 * * *"  # 10:30 GMT (winter)
  workflow_dispatch: # Also triggerable manually from the Actions tab

jobs:
  run-claude-and-email:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # ── 1. Checkout so prompt.txt is available in the workspace ─────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Skip if already ran today (prevents double-email on clock-change weeks)
      - name: Check if already ran today
        id: dedup
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          MARKER="/tmp/ran-$TODAY.marker"
          if [ -f "$MARKER" ]; then
            echo "Already ran today — skipping"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            touch "$MARKER"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      # ── 3. Build final prompt: append file output instruction ────────────────
      - name: Prepare prompt
        if: steps.dedup.outputs.skip != 'true'
        run: |
          cat prompt.txt > /tmp/final_prompt.txt
          echo "" >> /tmp/final_prompt.txt
          echo "---" >> /tmp/final_prompt.txt
          echo "ADDITIONAL INSTRUCTIONS:" >> /tmp/final_prompt.txt
          echo "- For Hacker News: use WebFetch on https://news.ycombinator.com/best to get the page content, then extract individual story links in the format https://news.ycombinator.com/item?id=XXXXXXX. Do NOT link to news.ycombinator.com/front. Each HN item must link to its specific item page." >> /tmp/final_prompt.txt
          echo "- When you have finished all research and compilation, write your COMPLETE formatted output to /tmp/news_output.md using Bash(cat > /tmp/news_output.md). This file is what gets emailed — it must contain the full briefing." >> /tmp/final_prompt.txt

      # ── 3. Run Claude with the augmented prompt ──────────────────────────────
      - name: Run Claude Code
        if: steps.dedup.outputs.skip != 'true'
        id: claude
        uses: anthropics/claude-code-base-action@beta
        with:
          prompt_file: "/tmp/final_prompt.txt"
          allowed_tools: "WebSearch,WebFetch,Bash,View,GlobTool,GrepTool"
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          max_turns: "40"

      # ── 4. Extract output and send via Resend ────────────────────────────────
      - name: Send output via Resend
        if: always() && steps.dedup.outputs.skip != 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          python3 << 'EOF'
          import os, json, subprocess, datetime, re

          run_url  = os.environ.get("RUN_URL", "")
          api_key  = os.environ.get("RESEND_API_KEY", "")
          exec_file = os.environ.get("EXECUTION_FILE", "")
          run_date = datetime.datetime.now(datetime.timezone.utc).strftime("%A, %d %B %Y")

          # ── Priority 1: read the output file Claude was told to write ─────────
          output = ""
          if os.path.exists("/tmp/news_output.md"):
              output = open("/tmp/news_output.md").read().strip()
              print(f"Read {len(output)} chars from /tmp/news_output.md")

          # ── Priority 2: fall back to execution log if file is missing/empty ──
          if not output and exec_file and os.path.exists(exec_file):
              print("Output file missing, falling back to execution log...")
              try:
                  raw = open(exec_file).read()

                  # Brace-depth parser handles mixed pretty/compact NDJSON
                  entries = []
                  depth, start = 0, None
                  for i, ch in enumerate(raw):
                      if ch == '{':
                          if depth == 0: start = i
                          depth += 1
                      elif ch == '}':
                          depth -= 1
                          if depth == 0 and start is not None:
                              try:
                                  entries.append(json.loads(raw[start:i+1]))
                              except json.JSONDecodeError:
                                  pass
                              start = None

                  print(f"Parsed {len(entries)} entries from execution log")

                  # Find the longest assistant text block — most likely the summary
                  best = ""
                  for entry in entries:
                      if entry.get("type") != "assistant":
                          continue
                      content = entry.get("message", {}).get("content", [])
                      if not isinstance(content, list):
                          continue
                      for block in content:
                          if isinstance(block, dict) and block.get("type") == "text":
                              text = block.get("text", "").strip()
                              if len(text) > len(best):
                                  best = text
                  if best:
                      output = best

              except Exception as e:
                  import traceback
                  output = f"(error reading execution log: {e}\n{traceback.format_exc()})"

          if not output:
              output = "(no output received — check the workflow run logs)"

          print(f"Final output length: {len(output)} chars")
          print(f"Preview: {output[:300]}")

          # ── Convert markdown to clean minimal HTML ────────────────────────────
          def md_inline(text):
              """Convert inline markdown: bold, italic, and [text](url) links."""
              # Links first — before escaping
              text = re.sub(r'\[([^\]]+)\]\((https?://[^\)]+)\)',
                            r'<a href="\2" style="color:#000;text-decoration:underline;">\1</a>', text)
              text = re.sub(r'\*\*(.+?)\*\*', r'<strong>\1</strong>', text)
              text = re.sub(r'\*(.+?)\*', r'<em>\1</em>', text)
              return text

          def esc(line):
              return line.replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;")

          html_lines = []
          in_list = False
          for line in output.split("\n"):
              # Headings — escape first, then apply inline (no links in headings usually)
              if line.startswith("### "):
                  if in_list: html_lines.append("</ul>"); in_list = False
                  html_lines.append(f'<h3 style="font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#888;margin:28px 0 8px;">{esc(line[4:])}</h3>')
              elif line.startswith("## "):
                  if in_list: html_lines.append("</ul>"); in_list = False
                  html_lines.append(f'<h2 style="font-size:16px;font-weight:600;color:#111;margin:32px 0 10px;padding-bottom:6px;border-bottom:1px solid #eee;">{esc(line[3:])}</h2>')
              elif line.startswith("# "):
                  if in_list: html_lines.append("</ul>"); in_list = False
                  html_lines.append(f'<h1 style="font-size:18px;font-weight:700;color:#000;margin:36px 0 12px;">{esc(line[2:])}</h1>')
              elif line.startswith("- ") or line.startswith("* "):
                  if not in_list: html_lines.append('<ul style="margin:6px 0 12px;padding-left:18px;">'); in_list = True
                  html_lines.append(f'<li style="margin:4px 0;color:#444;">{md_inline(esc(line[2:]))}</li>')
              elif line.strip() == "":
                  if in_list: html_lines.append("</ul>"); in_list = False
                  html_lines.append('<div style="height:8px;"></div>')
              else:
                  if in_list: html_lines.append("</ul>"); in_list = False
                  html_lines.append(f'<p style="margin:0 0 10px;color:#333;line-height:1.6;">{md_inline(esc(line))}</p>')

          if in_list:
              html_lines.append("</ul>")

          html_body = "\n".join(html_lines)
          html = f"""<!DOCTYPE html>
          <html>
            <body style="margin:0;padding:0;background:#fff;">
              <div style="max-width:620px;margin:0 auto;padding:40px 32px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,sans-serif;font-size:14px;color:#333;">
                <p style="margin:0 0 4px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#aaa;">Daily Briefing</p>
                <h1 style="margin:0 0 4px;font-size:22px;font-weight:700;color:#000;">{run_date}</h1>
                <div style="height:1px;background:#eee;margin:20px 0 24px;"></div>
                {html_body}
                <div style="height:1px;background:#eee;margin:32px 0 20px;"></div>
                <p style="margin:0;font-size:11px;color:#bbb;">
                  <a href="{run_url}" style="color:#bbb;">View run →</a>
                </p>
              </div>
            </body>
          </html>"""

          payload = {
              "from":    "Daily News <reports@infinitywave.design>",
              "to":      ["me@allisterantosik.com"],
              "subject": f"Daily News Briefing \u2014 {run_date}",
              "html":    html,
              "text":    output,
          }

          result = subprocess.run(
              ["curl", "-s", "-X", "POST", "https://api.resend.com/emails",
               "-H", f"Authorization: Bearer {api_key}",
               "-H", "Content-Type: application/json",
               "-d", json.dumps(payload),
               "--fail-with-body"],
              capture_output=True, text=True,
          )
          print("=== Resend response ===")
          print(result.stdout)
          if result.returncode != 0:
              raise SystemExit(f"curl failed: {result.stderr}")
          response = json.loads(result.stdout)
          if "id" in response:
              print(f"Email sent. Resend ID: {response['id']}")
          else:
              raise SystemExit(f"Unexpected Resend response: {result.stdout}")
          EOF
