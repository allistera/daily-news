name: Daily Claude Prompt

on:
  schedule:
    # 10:30 AM UTC — adjust for your timezone:
    #   BST (UTC+1, summer): use "30 9 * * *"  ← set for Scotland/BST
    #   GMT (UTC+0, winter): use "30 10 * * *"
    - cron: "30 9 * * *"
  workflow_dispatch: # Also triggerable manually from the Actions tab

jobs:
  run-claude-and-email:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # ── 1. Checkout so prompt.txt is available in the workspace ─────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Run Claude with prompt.txt, output saved to file ──────────────────
      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-base-action@beta
        with:
          prompt_file: "prompt.txt"
          # web_search is required — the prompt fetches live news articles
          allowed_tools: "web_search,View,GlobTool,GrepTool"
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          max_turns: "15"
          claude_env: |
            OUTPUT_FILE: /tmp/claude_output.txt

      # ── 3. Save Claude output to file (response output can be unreliable) ────
      - name: Save Claude output to file
        if: always()
        env:
          CLAUDE_OUTPUT: ${{ steps.claude.outputs.response }}
        run: |
          if [ -n "$CLAUDE_OUTPUT" ]; then
            echo "$CLAUDE_OUTPUT" > /tmp/claude_output.txt
            echo "Output captured from action output ($(wc -c < /tmp/claude_output.txt) bytes)"
          elif [ -f /tmp/claude_output.txt ]; then
            echo "Output already written to file by Claude"
          else
            echo "(Claude returned no output)" > /tmp/claude_output.txt
            echo "Warning: no output received from Claude"
          fi

      # ── 4. Send output via Resend ─────────────────────────────────────────────
      - name: Send output via Resend
        if: always()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          python3 << 'EOF'
          import os, json, subprocess, datetime

          # Read output from file — more reliable than the env var for large outputs
          try:
              with open("/tmp/claude_output.txt", "r") as f:
                  output = f.read().strip()
          except FileNotFoundError:
              output = "(no output file found)"

          if not output:
              output = "(Claude returned an empty response)"

          run_url  = os.environ.get("RUN_URL", "")
          api_key  = os.environ.get("RESEND_API_KEY", "")
          run_date = datetime.datetime.now(datetime.timezone.utc).strftime("%A, %d %B %Y")

          print(f"Output length: {len(output)} characters")

          # ── Convert markdown-style output to readable HTML ───────────────────
          # Basic conversion: preserve structure without escaping markdown chars
          html_lines = []
          for line in output.split("\n"):
              escaped = (
                  line
                  .replace("&", "&amp;")
                  .replace("<", "&lt;")
                  .replace(">", "&gt;")
              )
              # Convert ### headings
              if escaped.startswith("### "):
                  html_lines.append(f'<h3 style="margin: 20px 0 6px; color: #333;">{escaped[4:]}</h3>')
              elif escaped.startswith("## "):
                  html_lines.append(f'<h2 style="margin: 24px 0 8px; color: #111;">{escaped[3:]}</h2>')
              elif escaped.startswith("# "):
                  html_lines.append(f'<h1 style="margin: 28px 0 10px; color: #000;">{escaped[2:]}</h1>')
              # Convert bullet points
              elif escaped.startswith("- ") or escaped.startswith("* "):
                  html_lines.append(f'<li style="margin: 4px 0;">{escaped[2:]}</li>')
              elif escaped.startswith("**") and escaped.endswith("**"):
                  html_lines.append(f'<strong>{escaped[2:-2]}</strong><br>')
              elif escaped == "":
                  html_lines.append("<br>")
              else:
                  html_lines.append(f'{escaped}<br>')

          html_body = "\n".join(html_lines)

          html = f"""<html>
            <body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
                         max-width: 760px; margin: auto; padding: 32px; color: #1a1a1a;">
              <h2 style="margin-bottom: 4px;">&#x1F4F0; Daily News Briefing</h2>
              <p style="color: #888; font-size: 13px; margin-top: 0;">{run_date}</p>
              <hr style="border: none; border-top: 1px solid #e5e5e5; margin: 20px 0;">
              <div style="font-size: 14px; line-height: 1.7;">
                {html_body}
              </div>
              <hr style="border: none; border-top: 1px solid #e5e5e5; margin: 20px 0;">
              <p style="font-size: 12px; color: #bbb;">
                <a href="{run_url}" style="color: #6c63ff; text-decoration: none;">View workflow run &rarr;</a>
              </p>
            </body>
          </html>"""

          # ── Resend payload ───────────────────────────────────────────────────
          payload = {
              "from":    "Daily News <news@infinitywave.design>",  # ← your verified Resend sender
              "to":      ["me@allisterantosik.com"],
              "subject": f"Daily News Briefing \u2014 {run_date}",
              "html":    html,
              "text":    output,  # plain-text fallback
          }

          # ── Send ─────────────────────────────────────────────────────────────
          result = subprocess.run(
              [
                  "curl", "-s", "-X", "POST",
                  "https://api.resend.com/emails",
                  "-H", f"Authorization: Bearer {api_key}",
                  "-H", "Content-Type: application/json",
                  "-d", json.dumps(payload),
                  "--fail-with-body",
              ],
              capture_output=True,
              text=True,
          )

          print("=== Resend response ===")
          print(result.stdout)

          if result.returncode != 0:
              print("=== stderr ===")
              print(result.stderr)
              raise SystemExit(f"curl exited with code {result.returncode}")

          response = json.loads(result.stdout)
          if "id" in response:
              print(f"Email sent successfully. Resend ID: {response['id']}")
          else:
              raise SystemExit(f"Unexpected Resend response: {result.stdout}")
          EOF
