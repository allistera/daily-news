name: Daily Claude Prompt

on:
  schedule:
    # 10:30 AM UTC — adjust for your timezone:
    #   BST (UTC+1, summer): use "30 9 * * *"  ← set for Scotland/BST
    #   GMT (UTC+0, winter): use "30 10 * * *"
    - cron: "30 9 * * *"
  workflow_dispatch: # Also triggerable manually from the Actions tab

jobs:
  run-claude-and-email:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # ── 1. Checkout so prompt.txt is available in the workspace ─────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Run Claude with prompt.txt ────────────────────────────────────────
      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-base-action@beta
        with:
          prompt_file: "prompt.txt"
          allowed_tools: "View,GlobTool,GrepTool"
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          max_turns: "10"

      # ── 3. Build email payload and send via Resend ───────────────────────────
      - name: Send output via Resend
        if: always()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CLAUDE_OUTPUT: ${{ steps.claude.outputs.response }}
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          python3 << 'EOF'
          import os, json, subprocess, datetime

          output   = os.environ.get("CLAUDE_OUTPUT", "(no output received)")
          run_url  = os.environ.get("RUN_URL", "")
          api_key  = os.environ.get("RESEND_API_KEY", "")
          run_date = datetime.datetime.utcnow().strftime("%A, %d %B %Y")

          # ── HTML body ────────────────────────────────────────────────────────
          safe_output = (
              output
              .replace("&", "&amp;")
              .replace("<", "&lt;")
              .replace(">", "&gt;")
              .replace("\n", "<br>")
          )

          html = f"""<html>
            <body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
                         max-width: 760px; margin: auto; padding: 32px; color: #1a1a1a;">
              <h2 style="margin-bottom: 4px;">&#x1F916; Daily Claude Report</h2>
              <p style="color: #888; font-size: 13px; margin-top: 0;">{run_date}</p>
              <hr style="border: none; border-top: 1px solid #e5e5e5; margin: 20px 0;">
              <div style="background: #f7f7f8; border-radius: 8px; padding: 20px;
                          font-size: 14px; line-height: 1.7; white-space: pre-wrap;">{safe_output}</div>
              <hr style="border: none; border-top: 1px solid #e5e5e5; margin: 20px 0;">
              <p style="font-size: 12px; color: #bbb;">
                <a href="{run_url}" style="color: #6c63ff; text-decoration: none;">View workflow run &rarr;</a>
              </p>
            </body>
          </html>"""

          # ── Resend payload ───────────────────────────────────────────────────
          payload = {
              "from":    "Claude Reports <me@infinitywave.design>",  # ← your verified Resend sender
              "to":      ["me@allisterantosik.com"],
              "subject": f"Daily News Report \u2014 {run_date}",
              "html":    html,
              "text":    output,  # plain-text fallback
          }

          # ── Send ─────────────────────────────────────────────────────────────
          result = subprocess.run(
              [
                  "curl", "-s", "-X", "POST",
                  "https://api.resend.com/emails",
                  "-H", f"Authorization: Bearer {api_key}",
                  "-H", "Content-Type: application/json",
                  "-d", json.dumps(payload),
                  "--fail-with-body",
              ],
              capture_output=True,
              text=True,
          )

          print("=== Resend response ===")
          print(result.stdout)

          if result.returncode != 0:
              print("=== stderr ===")
              print(result.stderr)
              raise SystemExit(f"curl exited with code {result.returncode}")

          response = json.loads(result.stdout)
          if "id" in response:
              print(f"Email sent successfully. Resend ID: {response['id']}")
          else:
              raise SystemExit(f"Unexpected Resend response: {result.stdout}")
          EOF
