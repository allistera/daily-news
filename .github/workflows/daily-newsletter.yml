name: Daily Newsletter

on:
  schedule:
    # 05:00 UTC = 06:00 UK during BST (summer) and 05:00 UK during GMT (winter).
    # Cron has no timezone, so it can't follow the BST/GMT switch automatically.
    # (Switch to '0 6 * * *' if you'd rather it be 06:00 in winter.)
    # Note: GitHub may delay scheduled runs by several minutes.
    - cron: '0 5 * * *'
  workflow_dispatch: {}        # Allow manual runs from the Actions tab

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # send_email.py spawns MCP servers (e.g. `product-hunt-mcp`) via fastmcp,
      # so they must be on PATH. Each lives in its own isolated tool venv to
      # avoid clashing with this project's fastmcp pin.
      - name: Install MCP servers
        run: |
          uv tool install product-hunt-mcp
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"

      - name: Send daily newsletter
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          PRODUCT_HUNT_TOKEN: ${{ secrets.PRODUCT_HUNT_TOKEN }}
          # Auto-provided by Actions; raises the GitHub search rate limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run send_email.py
